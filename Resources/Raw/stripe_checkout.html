<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fizetés</title>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            padding: 24px 16px;
            min-height: 100vh;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            box-shadow: 0 2px 16px rgba(0,0,0,0.08);
        }

        h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #1a1a1a;
        }

        .amount {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }

        #payment-element {
            margin-bottom: 20px;
        }

        #pay-button {
            width: 100%;
            padding: 14px;
            background: #635BFF;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

            #pay-button:disabled {
                background: #a0a0a0;
                cursor: not-allowed;
            }

        #error-message {
            color: #df1b41;
            font-size: 14px;
            margin-top: 12px;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Fizetés</h2>
        <div class="amount" id="amount-label"></div>
        <div id="payment-element"></div>
        <button id="pay-button" disabled>Betöltés...</button>
        <div id="error-message"></div>
    </div>
    <script>
    const p = window.__STRIPE_PARAMS__ || {};
    const clientSecret   = p.clientSecret;
    const publishableKey = p.publishableKey;
    const amount         = p.amount;

    document.getElementById('amount-label').textContent =
        amount ? parseInt(amount).toLocaleString('hu-HU') + ' HUF' : '';

    const stripe   = Stripe(publishableKey);
    const elements = stripe.elements({ clientSecret });
    const paymentElement = elements.create('payment');
    paymentElement.mount('#payment-element');

    const btn      = document.getElementById('pay-button');
    const errorDiv = document.getElementById('error-message');

    paymentElement.on('ready', () => {
        btn.disabled = false;
        btn.textContent = 'Fizetés';
    });

    btn.addEventListener('click', async () => {
        btn.disabled = true;
        btn.textContent = 'Feldolgozás...';
        errorDiv.textContent = '';

        const { error, paymentIntent } = await stripe.confirmPayment({
            elements,
            redirect: 'if_required',
            confirmParams: {}
        });

        if (error) {
            errorDiv.textContent = error.message;
            btn.disabled = false;
            btn.textContent = 'Fizetés';
        } else if (paymentIntent?.status === 'succeeded') {
            window.location.href = 'bufeapp://payment-success';
        }
    });
    </script>
</body>
</html>
