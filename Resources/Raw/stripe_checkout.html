<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fizetés</title>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Light theme (default) */
        :root {
            --bg: #f5f5f5;
            --card-bg: #ffffff;
            --text: #1a1a1a;
            --subtext: #666666;
            --border: #e0e0e0;
            --btn-bg: #ee8c2b;
            --btn-text: #ffffff;
            --btn-disabled: #a0a0a0;
            --error: #df1b41;
            --back-bg: #eeeeee;
            --back-text: #ee8c2b;
            --shadow: rgba(0,0,0,0.08);
        }

        /* Dark theme */
        body.dark {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #f0f0f0;
            --subtext: #aaaaaa;
            --border: #333333;
            --btn-bg: #ee8c2b;
            --btn-text: #ffffff;
            --btn-disabled: #555555;
            --error: #ff6b6b;
            --back-bg: #2a2a2a;
            --back-text: #ee8c2b;
            --shadow: rgba(0,0,0,0.4);
        }

        body {
            background: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 16px;
            min-height: 100vh;
            transition: background 0.2s;
        }

        /* Back button */
        #back-button {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--back-bg);
            color: var(--back-text);
            border: none;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 15px;
            cursor: pointer;
            margin-bottom: 16px;
            width: fit-content;
        }

            #back-button svg {
                fill: var(--back-text);
            }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }

        h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text);
        }

        .amount {
            font-size: 14px;
            color: var(--subtext);
            margin-bottom: 20px;
        }

        #payment-element {
            margin-bottom: 20px;
        }

        #pay-button {
            width: 100%;
            padding: 14px;
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

            #pay-button:disabled {
                background: var(--btn-disabled);
                cursor: not-allowed;
            }

        #error-message {
            color: var(--error);
            font-size: 14px;
            margin-top: 12px;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <button id="back-button" onclick="window.location.href='bufeapp://payment-cancel'">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24">
            <path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6z" />
        </svg>
        Vissza
    </button>

    <div class="card">
        <h2>Fizetés</h2>
        <div class="amount" id="amount-label"></div>
        <div id="payment-element"></div>
        <button id="pay-button" disabled>Betöltés...</button>
        <div id="error-message"></div>
    </div>

    <script>
        const p = window.__STRIPE_PARAMS__ || {};
        const clientSecret = p.clientSecret;
        const publishableKey = p.publishableKey;
        const amount = p.amount;
        const theme = p.theme || 'light';

        // Apply theme to body
        if (theme === 'dark') {
            document.body.classList.add('dark');
        }

        document.getElementById('amount-label').textContent =
            amount ? parseInt(amount).toLocaleString('hu-HU') + ' HUF' : '';

        // Pass theme to Stripe Elements too
        const stripe = Stripe(publishableKey);
        const elements = stripe.elements({
            clientSecret,
            appearance: {
                theme: theme === 'dark' ? 'night' : 'stripe'
            }
        });

        const paymentElement = elements.create('payment');
        paymentElement.mount('#payment-element');

        const btn = document.getElementById('pay-button');
        const errorDiv = document.getElementById('error-message');

        paymentElement.on('ready', () => {
            btn.disabled = false;
            btn.textContent = 'Fizetés';
        });

        btn.addEventListener('click', async () => {
            btn.disabled = true;
            btn.textContent = 'Feldolgozás...';
            errorDiv.textContent = '';

            const { error, paymentIntent } = await stripe.confirmPayment({
                elements,
                redirect: 'if_required',
                confirmParams: {}
            });

            if (error) {
                errorDiv.textContent = error.message;
                btn.disabled = false;
                btn.textContent = 'Fizetés';
            } else if (paymentIntent?.status === 'succeeded') {
                window.location.href = 'bufeapp://payment-success';
            }
        });
    </script>
</body>
</html>
